<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行行程</title>
<style>
:root{
  --bg:#f6f1e7;--card:#fffdf8;--ink:#2a2420;--muted:#7b7067;--line:#dccfbc;
  --accent:#b8322a;--accent-ink:#fff;--accent-soft:#f6e0da;
  --gold-soft:#f8eecf;--gold-ink:#7a5a0a;
  --shadow:0 1px 2px rgba(60,40,20,.08),0 6px 20px rgba(60,40,20,.06);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1613;--card:#252019;--ink:#f0e9df;--muted:#a89d92;--line:#3b342c;
    --accent:#e5604f;--accent-ink:#1a1613;--accent-soft:#3a2420;
    --gold-soft:#34301a;--gold-ink:#e8c872;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tools{display:flex;gap:6px;align-items:center;position:relative;flex:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;
  font-size:14px;line-height:1.4;list-style:none;white-space:nowrap}
.btn::-webkit-details-marker{display:none}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:2px}
.pop button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}
.pop button:hover{background:var(--accent-soft)}
.pop p{margin:6px 12px 4px;font-size:12.5px;color:var(--muted);line-height:1.5}
.editbar{background:var(--accent-soft);color:var(--accent);font-size:13px;padding:8px 16px;text-align:center}

/* landing */
.hero{padding:34px 0 8px}
.kicker{letter-spacing:.25em;font-size:12px;color:var(--accent);font-weight:700}
.hero h1{margin:6px 0 4px;font:700 clamp(28px,7vw,40px)/1.2 "Noto Serif TC","Songti TC","PMingLiU",serif}
.range{color:var(--muted);margin:0 0 4px}
.month{margin:26px 0 10px;font-weight:700;color:var(--muted);letter-spacing:.08em;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;box-shadow:var(--shadow);min-height:132px;position:relative}
.card:active{transform:scale(.98)}
.card.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cd{display:flex;align-items:baseline;gap:8px}
.num{font:700 34px/1 "Noto Serif TC","Songti TC",serif;color:var(--accent)}
.wk{font-size:13px;color:var(--muted)}
.ct{font-size:12px;color:var(--muted);margin-top:4px}
.cti{font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:1px 8px;border-radius:999px}

/* day */
.dayhead{padding:24px 0 14px}
.bigdate{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigdate .n{font:700 44px/1 "Noto Serif TC","Songti TC",serif;color:var(--accent)}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:1px 10px;color:var(--muted)}
.chip.tag{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.dayhead h2{margin:10px 0 6px;font:700 clamp(20px,5vw,26px)/1.35 "Noto Serif TC","Songti TC",serif}
.lodging{margin:0;color:var(--muted);font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}

ol.tl{list-style:none;margin:8px 0 0;padding:0}
li.it{display:grid;grid-template-columns:78px 1fr}
.tm{text-align:right;padding-right:14px;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;line-height:1.35;padding-top:3px}
.tm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.body{border-left:2px solid var(--line);padding:0 0 18px 18px;position:relative;min-width:0}
li.main .body::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.tx{white-space:pre-wrap;overflow-wrap:anywhere}
li.sub .body{padding-bottom:8px;margin-top:-10px;font-size:14.5px;color:var(--muted)}
li.star .tx{display:inline-block;background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:6px 12px;font-size:14.5px}
li.star .body,li.box .body{padding-top:2px}
li.box .tx{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14.5px}
li.box .bt{font-weight:700;margin-bottom:4px;color:var(--accent)}
.hl{color:var(--accent);font-weight:600}
li.sub .hl{font-weight:600}

.sec{margin-top:26px}
.sec h3{margin:0 0 8px;font-size:16px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
th{background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}

.daynav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.daynav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.daynav a,.daynav span.dis{display:block;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:14px;text-align:center;white-space:nowrap}
.daynav span.dis{opacity:.35}
.daynav .mid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:9px 16px}

/* editing */
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{resize:vertical;line-height:1.55;overflow:hidden}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.ed-it{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
.ed-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ed-row select{width:auto;flex:none}
.ed-row .tin{flex:1;min-width:0}
.mv{display:flex;gap:4px;flex:none}
.mv button,.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px}
.addrow{display:flex;gap:8px;margin:12px 0;align-items:center}
.addrow select{width:auto}
.tbl-ed{margin-top:18px}
.tbl-ed td,.tbl-ed th{padding:4px;min-width:120px}
.tbl-ed textarea,.tbl-ed input{font-size:13.5px;padding:5px 7px}
.row-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:480px){
  li.it{grid-template-columns:66px 1fr}
  .tm{padding-right:10px;font-size:13px}
  .body{padding-left:14px}
}
@media print{.topbar,.daynav,.editbar,#toast{display:none!important}body{background:#fff;color:#000}}

.login{max-width:380px;margin:16vh auto 0;padding:0 24px;text-align:center}
.login h1{margin:6px 0 4px;font:700 32px/1.2 "Noto Serif TC","Songti TC","PMingLiU",serif}
.login p{color:var(--muted);margin:4px 0 0}
.login input{margin:18px 0 10px;text-align:center;font-size:18px;padding:12px}
.login .btn{width:100%;padding:11px;font-size:16px}
.err{color:var(--accent);min-height:1.6em;font-size:14px;margin-top:10px}
.center{text-align:center;padding:30vh 24px 0;color:var(--muted)}
.off{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<noscript><p style="padding:24px">請開啟 JavaScript 以檢視行程。</p></noscript>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, getDoc, setDoc, collection, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGX07feqBcBjZ0evu-akpw3D8xNuKOMNQ",
  authDomain: "kyoto-trip-2026-3f54e.firebaseapp.com",
  projectId: "kyoto-trip-2026-3f54e",
  storageBucket: "kyoto-trip-2026-3f54e.firebasestorage.app",
  messagingSenderId: "563986774299",
  appId: "1:563986774299:web:8f3bc8b36df8a3a8d6fbbe"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let db;
try { db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = getFirestore(fbApp); }

const WD = '日一二三四五六';
const KINDS = [['i','一般'],['s','子項目'],['g','🌟 重點'],['b','提示框']];
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

let data = { title: '', subtitle: '', days: [] };
let state = 'boot';            // boot | login | fatal | app
let role = null;               // null | 'view' | 'edit'
let uid = null, remote = null, ready = false, unsub = null;
let edit = false, cur = '', snap = null, snapCur = '', pending = false;
let loginErr = '', fatalMsg = '', busy = false;

/* ---------- helpers ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s) { return esc(s).replace(/【([^】]*)】/g, '<strong class="hl">【$1】</strong>'); }
function pad(n) { return String(n).padStart(2, '0'); }
function parseId(id) { const p = id.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
function wd(id) { const p = parseId(id); return '週' + WD[new Date(p.y, p.m - 1, p.d).getDay()]; }
function md(id) { const p = parseId(id); return p.m + '/' + p.d; }
function ymd(id) { const p = parseId(id); return p.y + '/' + pad(p.m) + '/' + pad(p.d); }
function todayId() { const t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
function validId(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s); }
function curDay() { return data.days.filter(d => d.date === cur)[0]; }
function sortDays(a) { a.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0); return a; }
function readHash() { let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {} return h; }
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2600);
}
function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function setPath(obj, path, val) {
  const p = path.split('.'); let o = obj;
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length - 1]] = val;
}
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]); }
function normDay(d) {
  return Object.assign({ date: '', tag: '', title: '', lodging: '', transport: '', meals: '' }, d,
    { items: Array.isArray(d.items) ? d.items : [], tables: Array.isArray(d.tables) ? d.tables : [] });
}
function buildData(r) {
  const days = sortDays(Object.keys(r.days).map(k => JSON.parse(JSON.stringify(r.days[k]))));
  return { title: (r.meta && r.meta.title) || '', subtitle: (r.meta && r.meta.subtitle) || '', days };
}
function cacheRole() { try { localStorage.setItem('kyoto-role:' + uid, role || ''); } catch (e) {} }

/* ---------- auth / roles ---------- */
async function claim(r, pw) { await withTimeout(setDoc(doc(db, 'members', uid), { role: r, key: pw }), 12000); }

async function login(pw) {
  if (busy) return;
  if (!pw) { loginErr = '請輸入密碼'; render(false); return; }
  busy = true; loginErr = ''; render(false);
  try {
    let got = null;
    for (const r of ['edit', 'view']) {
      try { await claim(r, pw); got = r; break; }
      catch (e) { if (e && e.code === 'permission-denied') continue; throw e; }
    }
    if (!got) loginErr = '密碼不正確';
    else { role = got; cacheRole(); state = 'boot'; busy = false; render(false); startSync(); return; }
  } catch (e) { loginErr = '連線失敗，請檢查網路後再試'; }
  busy = false; if (state === 'login') render(false);
}
async function unlock() {
  const pw = prompt('請輸入編輯密碼');
  if (!pw) return;
  try { await claim('edit', pw); role = 'edit'; cacheRole(); render(true); toast('已取得編輯權限'); }
  catch (e) { toast(e && e.code === 'permission-denied' ? '編輯密碼不正確' : '連線失敗，請稍後再試'); }
}
async function logout() {
  if (unsub) { unsub(); unsub = null; }
  edit = false; snap = null; role = null; remote = null; ready = false; pending = false;
  data = { title: '', subtitle: '', days: [] }; cur = ''; state = 'boot';
  history.replaceState(null, '', location.pathname + location.search);
  render(false);
  try { await signOut(auth); } catch (e) {}
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    state = 'boot'; render(false);
    signInAnonymously(auth).catch(e => {
      state = 'fatal';
      fatalMsg = (e && e.code === 'auth/operation-not-allowed')
        ? '尚未在 Firebase 啟用「匿名」登入方式，請到 Authentication → 登入方式開啟。'
        : '無法連線到 Firebase，請確認網路後重新整理。';
      render(false);
    });
    return;
  }
  uid = user.uid; role = null;
  try { const s = await getDoc(doc(db, 'members', uid)); role = s.exists() ? s.data().role : null; }
  catch (e) { try { role = localStorage.getItem('kyoto-role:' + uid) || null; } catch (e2) {} }
  if (role) { state = 'boot'; render(false); startSync(); }
  else { state = 'login'; render(false); }
});

/* ---------- sync ---------- */
function startSync() {
  ready = false;
  if (unsub) unsub();
  const timer = setTimeout(() => {          // 離線且沒有快取時，不要一直轉圈
    if (!ready) { ready = true; data = buildData(remote || { meta: null, days: {} }); afterDataChange(); }
  }, 7000);
  unsub = onSnapshot(collection(db, 'trip'), snapshot => {
    const r = { meta: null, days: {} };
    snapshot.forEach(s => {
      const v = s.data();
      if (s.id === 'meta') r.meta = v;
      else if (v && v.json) { try { const d = normDay(JSON.parse(v.json)); r.days[d.date] = d; } catch (e) {} }
    });
    remote = r;
    if (!ready && snapshot.empty && snapshot.metadata && snapshot.metadata.fromCache) return;
    ready = true; clearTimeout(timer);
    if (edit) { if (!pending) { pending = true; toast('其他人更新了內容，完成編輯後會一併同步'); } }
    else { data = buildData(r); afterDataChange(); }
  }, err => {
    if (err && err.code === 'permission-denied') {
      if (unsub) { unsub(); unsub = null; }
      role = null; state = 'login'; loginErr = '權限已失效，請重新輸入密碼'; render(false);
    }
  });
}
function afterDataChange() {
  state = 'app';
  cur = readHash(); if (cur && !curDay()) cur = '';
  render(true);
}
async function commit(before, after) {
  const b = writeBatch(db); let n = 0;
  if (before.title !== after.title || before.subtitle !== after.subtitle) {
    b.set(doc(db, 'trip', 'meta'), { title: after.title || '', subtitle: after.subtitle || '' }); n++;
  }
  const bm = {}, am = {};
  before.days.forEach(d => bm[d.date] = JSON.stringify(d));
  after.days.forEach(d => am[d.date] = JSON.stringify(d));
  Object.keys(am).forEach(k => { if (bm[k] !== am[k]) { b.set(doc(db, 'trip', 'd' + k), { date: k, json: am[k] }); n++; } });
  Object.keys(bm).forEach(k => { if (!(k in am)) { b.delete(doc(db, 'trip', 'd' + k)); n++; } });
  if (!n) return 0;
  await withTimeout(b.commit(), 10000);
  return n;
}

/* ---------- views ---------- */
function topbar() {
  const tools = edit
    ? '<button class="btn on" data-act="done">完成編輯</button><button class="btn" data-act="discard">放棄編輯</button>'
    : (role === 'edit' ? '<button class="btn" data-act="edit">✏️ 編輯</button>' : '<button class="btn" data-act="unlock">🔒 編輯</button>');
  return '<div class="topbar"><div class="topbar-in">' +
    '<a class="brand" href="#">🏮 ' + esc(data.title || '旅行行程') + (navigator.onLine ? '' : '<span class="off">📴 離線</span>') + '</a>' +
    '<div class="tools">' + tools +
      '<details class="menu"><summary class="btn" aria-label="更多選項">⋯</summary><div class="pop">' +
        '<button data-act="exportjson">⬇️ 匯出備份（JSON）</button>' +
        (role === 'edit' ? '<button data-act="importjson">⬆️ 匯入備份（JSON）</button>' : '') +
        '<button data-act="logout">🚪 登出</button>' +
        '<p>行程資料存放在雲端，編輯後所有人看到的內容會即時同步。登出後需要重新輸入密碼。</p>' +
      '</div></details>' +
    '</div></div></div>' +
    (edit ? '<div class="editbar">✏️ 編輯模式：按「完成編輯」才會儲存並同步給所有人，「放棄編輯」則不儲存這次的變更</div>' : '');
}
function loginView() {
  return '<div class="login"><div class="kicker">TRIP ITINERARY</div><h1>🏮 旅行行程</h1><p>請輸入密碼</p>' +
    '<input type="password" id="pw" autocomplete="off" enterkeyhint="go" placeholder="密碼"' + (busy ? ' disabled' : '') + '>' +
    '<button class="btn on" data-act="login"' + (busy ? ' disabled' : '') + '>' + (busy ? '驗證中…' : '進入') + '</button>' +
    '<div class="err">' + esc(loginErr) + '</div></div>';
}
function landing() {
  const days = data.days; let h = '';
  const first = days.length ? days[0].date : '', last = days.length ? days[days.length - 1].date : '';
  h += '<div class="wrap"><header class="hero"><div class="kicker">TRIP ITINERARY</div>';
  if (edit) {
    h += '<label class="fld"><span>標題</span><input data-f="root:title" value="' + esc(data.title) + '"></label>' +
         '<label class="fld"><span>副標</span><input data-f="root:subtitle" value="' + esc(data.subtitle) + '"></label>';
  } else {
    h += '<h1>' + esc(data.title || '旅行行程') + '</h1>';
  }
  if (days.length) h += '<p class="range">' + ymd(first) + ' – ' + ymd(last) + '　·　共 ' + days.length + ' 天</p>';
  if (!edit && data.subtitle) h += '<p class="range">' + esc(data.subtitle) + '</p>';
  h += '</header>';
  if (!days.length) {
    h += '<div class="empty">' + (role === 'edit'
      ? '目前還沒有行程。請按右上角「⋯」→「匯入備份（JSON）」選擇 seed.json，或按「✏️ 編輯」→「＋ 新增一天」。'
      : '目前還沒有行程資料，請聯絡編輯者。') + '</div>';
  }
  const groups = [], map = {};
  days.forEach(d => {
    const p = parseId(d.date), k = p.y + '-' + p.m;
    if (!map[k]) { map[k] = { y: p.y, m: p.m, days: [] }; groups.push(map[k]); }
    map[k].days.push(d);
  });
  const td = todayId();
  groups.forEach(g => {
    h += '<div class="month">' + g.y + ' 年 ' + g.m + ' 月</div><div class="grid">';
    g.days.forEach(d => {
      h += '<a class="card' + (d.date === td ? ' today' : '') + '" href="#' + d.date + '">' +
        (d.date === td ? '<span class="badge">今天</span>' : '') +
        '<div class="cd"><span class="num">' + parseId(d.date).d + '</span><span class="wk">' + wd(d.date) + '</span></div>' +
        '<div class="ct">' + esc(d.tag) + '</div><div class="cti">' + esc(d.title) + '</div></a>';
    });
    h += '</div>';
  });
  if (edit) h += '<div class="addrow" style="margin-top:22px"><button class="btn" data-act="dayadd">＋ 新增一天</button></div>';
  return h + '</div>';
}
function timeHtml(t) {
  if (!t) return '';
  const p = t.split(/\s*[-–~]\s*/);
  if (p.length > 1 && /\d/.test(p[0])) return '<div class="tm">' + esc(p[0]) + '<small>– ' + esc(p[1]) + '</small></div>';
  return '<div class="tm">' + esc(t) + '</div>';
}
function itemHtml(it) {
  const k = it.kind;
  if (k === 's') return '<li class="it sub"><div></div><div class="body"><div class="tx">' + fmt(it.text) + '</div></div></li>';
  if (k === 'g') return '<li class="it star"><div></div><div class="body"><div class="tx">' + fmt(it.text) + '</div></div></li>';
  if (k === 'b') return '<li class="it box"><div></div><div class="body"><div class="tx">' + (it.time ? '<div class="bt">' + esc(it.time) + '</div>' : '') + fmt(it.text) + '</div></div></li>';
  return '<li class="it main"><div>' + timeHtml(it.time) + '</div><div class="body"><div class="tx">' + fmt(it.text) + '</div></div></li>';
}
function tableHtml(t) {
  let h = '<section class="sec"><h3>' + esc(t.title) + '</h3><div class="scroll"><table><thead><tr>';
  t.headers.forEach(x => { h += '<th>' + esc(x) + '</th>'; });
  h += '</tr></thead><tbody>';
  t.rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + fmt(c) + '</td>').join('') + '</tr>'; });
  return h + '</tbody></table></div></section>';
}
function kindSel(attrs, v) {
  return '<select ' + attrs + '>' + KINDS.map(k => '<option value="' + k[0] + '"' + (k[0] === v ? ' selected' : '') + '>' + k[1] + '</option>').join('') + '</select>';
}
function itemEdit(it, i, n) {
  return '<li class="ed-it"><div class="ed-row">' + kindSel('data-f="items.' + i + '.kind"', it.kind) +
    '<input class="tin" data-f="items.' + i + '.time" placeholder="' + (it.kind === 'b' ? '標題' : '時間（如 09:00 - 10:00）') + '" value="' + esc(it.time) + '">' +
    '<span class="mv"><button data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
    '<button data-act="down" data-i="' + i + '"' + (i === n - 1 ? ' disabled' : '') + '>↓</button>' +
    '<button data-act="del" data-i="' + i + '">✕</button></span></div>' +
    '<textarea rows="2" data-f="items.' + i + '.text">' + esc(it.text) + '</textarea></li>';
}
function tableEdit(t, ti) {
  let h = '<section class="tbl-ed"><div class="ed-row"><input class="tin" data-f="tables.' + ti + '.title" value="' + esc(t.title) + '" placeholder="表格標題">' +
    '<button class="mini" data-act="tdel" data-t="' + ti + '">刪除表格</button></div><div class="scroll"><table><thead><tr>';
  t.headers.forEach((x, c) => { h += '<th><input data-f="tables.' + ti + '.headers.' + c + '" value="' + esc(x) + '"></th>'; });
  h += '<th></th></tr></thead><tbody>';
  t.rows.forEach((r, ri) => {
    h += '<tr>' + r.map((c, ci) => '<td><textarea rows="2" data-f="tables.' + ti + '.rows.' + ri + '.' + ci + '">' + esc(c) + '</textarea></td>').join('') +
      '<td><button class="mini" data-act="trowdel" data-t="' + ti + '" data-r="' + ri + '">✕</button></td></tr>';
  });
  return h + '</tbody></table></div><div class="row-tools"><button class="mini" data-act="trow" data-t="' + ti + '">＋ 列</button>' +
    '<button class="mini" data-act="tcol" data-t="' + ti + '">＋ 欄</button>' +
    '<button class="mini" data-act="tcoldel" data-t="' + ti + '">－ 欄</button></div></section>';
}
function dayView() {
  const d = curDay(), idx = data.days.indexOf(d); let h = '<div class="wrap">';
  if (edit) {
    h += '<div class="dayhead"><label class="fld"><span>日期</span><input type="date" data-act="setdate" value="' + d.date + '"></label>' +
      '<label class="fld"><span>標籤（如 京都 Day 1）</span><input data-f="tag" value="' + esc(d.tag) + '"></label>' +
      '<label class="fld"><span>當天標題</span><input data-f="title" value="' + esc(d.title) + '"></label>' +
      '<label class="fld"><span>住宿（可換行填地址、電話）</span><textarea rows="2" data-f="lodging">' + esc(d.lodging) + '</textarea></label></div>';
    h += '<ol class="tl" style="margin:0;padding:0">' + d.items.map((it, i) => itemEdit(it, i, d.items.length)).join('') + '</ol>';
    h += '<div class="addrow">' + kindSel('id="addkind"', 'i') + '<button class="btn" data-act="add">＋ 新增項目</button></div>';
    d.tables.forEach((t, ti) => { h += tableEdit(t, ti); });
    h += '<div class="addrow"><button class="btn" data-act="tnew">＋ 新增表格</button></div>';
    h += '<label class="fld sec"><span>🎫 交通及票券</span><textarea rows="3" data-f="transport">' + esc(d.transport) + '</textarea></label>' +
         '<label class="fld"><span>🍽️ 餐食</span><textarea rows="3" data-f="meals">' + esc(d.meals) + '</textarea></label>';
    h += '<div class="addrow" style="margin-top:28px"><button class="btn danger" data-act="daydel">🗑 刪除這一天</button></div>';
  } else {
    h += '<div class="dayhead"><div class="bigdate"><span class="n">' + md(d.date) + '</span><span class="chip">' + wd(d.date) + '</span>' +
      (d.tag ? '<span class="chip tag">' + esc(d.tag) + '</span>' : '') + '</div><h2>' + esc(d.title) + '</h2>' +
      (d.lodging ? '<p class="lodging">🏨 ' + esc(d.lodging) + '</p>' : '') + '</div>';
    h += '<ol class="tl">' + d.items.map(itemHtml).join('') + '</ol>';
    d.tables.forEach(t => { h += tableHtml(t); });
    if (d.transport) h += '<section class="sec"><h3>🎫 交通及票券</h3><div class="note">' + fmt(d.transport) + '</div></section>';
    if (d.meals) h += '<section class="sec"><h3>🍽️ 餐食</h3><div class="note">' + fmt(d.meals) + '</div></section>';
  }
  h += '</div>';
  const pv = data.days[idx - 1], nx = data.days[idx + 1];
  h += '<nav class="daynav"><div class="daynav-in">' +
    (pv ? '<a href="#' + pv.date + '">← ' + md(pv.date) + '</a>' : '<span class="dis">←</span>') +
    '<a class="mid" href="#">首頁</a>' +
    (nx ? '<a href="#' + nx.date + '">' + md(nx.date) + ' →</a>' : '<span class="dis">→</span>') + '</div></nav>';
  return h;
}
function render(keep) {
  const y = window.scrollY;
  if (state === 'login') app.innerHTML = loginView();
  else if (state === 'fatal') app.innerHTML = '<div class="center">' + esc(fatalMsg) + '</div>';
  else if (state === 'boot') app.innerHTML = '<div class="center">載入中…</div>';
  else app.innerHTML = topbar() + (cur && curDay() ? dayView() : landing());
  app.querySelectorAll('textarea').forEach(autosize);
  const d = state === 'app' && cur && curDay();
  document.title = d ? (md(d.date) + ' ' + d.title) : '旅行行程';
  window.scrollTo(0, keep ? y : 0);
  if (state === 'login' && !busy) { const p = $('#pw'); if (p) p.focus(); }
}
function route() {
  if (state !== 'app') return;
  cur = readHash(); if (cur && !curDay()) cur = '';
  render(false);
}

/* ---------- io ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function importJson() {
  if (edit) { toast('請先完成或放棄編輯'); return; }
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      let after;
      try {
        const o = JSON.parse(r.result);
        if (!o || !Array.isArray(o.days) || o.days.some(d => !validId(d.date))) throw new Error('format');
        after = { title: o.title || '', subtitle: o.subtitle || '', days: sortDays(o.days.map(normDay)) };
      } catch (e) { toast('匯入失敗：檔案格式不正確'); return; }
      if (data.days.length && !confirm('匯入會取代目前雲端上的全部行程，確定嗎？')) return;
      try {
        await commit(buildData(remote || { meta: null, days: {} }), after);
        toast('已匯入並同步');
      } catch (e) { toast(e && e.code === 'timeout' ? '目前離線，連線後會自動同步' : '匯入失敗：' + ((e && e.code) || '')); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- events ---------- */
app.addEventListener('input', e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  const base = f.indexOf('root:') === 0 ? data : curDay(); if (!base) return;
  setPath(base, f.replace('root:', ''), el.value);
  if (el.tagName === 'TEXTAREA') autosize(el);
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'setdate') {
    const d = curDay(), v = el.value;
    if (!validId(v)) return;
    if (v !== d.date && data.days.some(x => x.date === v)) { toast('這個日期已經有行程了'); el.value = d.date; return; }
    d.date = v; sortDays(data.days); cur = v; history.replaceState(null, '', '#' + v); render(true);
  }
});
app.addEventListener('keydown', e => {
  if (e.target.id === 'pw' && e.key === 'Enter') login(e.target.value.trim());
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const a = b.dataset.act, d = curDay(), i = +b.dataset.i, t = +b.dataset.t, r = +b.dataset.r;
  const m = b.closest('details'); if (m) m.open = false;
  switch (a) {
    case 'login': login(($('#pw') || {}).value ? $('#pw').value.trim() : ''); return;
    case 'unlock': unlock(); return;
    case 'logout': logout(); return;
    case 'edit': snap = JSON.stringify(data); snapCur = cur; pending = false; edit = true; render(true); return;
    case 'done': {
      const before = JSON.parse(snap), after = data;
      edit = false; snap = null; render(true);
      try {
        const n = await commit(before, after); pending = false;
        if (!n) { if (remote) { data = buildData(remote); afterDataChange(); } toast('沒有任何變更'); }
        else toast('已儲存並同步');
      } catch (err) {
        if (err && err.code === 'timeout') toast('目前離線，連線後會自動同步');
        else if (err && err.code === 'permission-denied') {
          role = 'view'; if (remote) data = buildData(remote); afterDataChange(); toast('沒有編輯權限，變更未儲存');
        } else toast('儲存失敗：' + ((err && err.code) || '未知錯誤'));
      }
      return;
    }
    case 'discard': {
      const changed = JSON.stringify(data) !== snap;
      if (changed && !confirm('放棄這次編輯？尚未按「完成編輯」的變更都不會儲存。')) return;
      const s = snap;
      edit = false; snap = null; pending = false;
      data = remote ? buildData(remote) : JSON.parse(s);
      if (cur && !curDay()) { cur = snapCur; if (cur && !curDay()) cur = ''; }
      history.replaceState(null, '', cur ? '#' + cur : location.pathname + location.search);
      render(true); toast(changed ? '已放棄這次編輯' : '沒有任何變更'); return;
    }
    case 'up': if (i > 0) { const x = d.items[i]; d.items[i] = d.items[i - 1]; d.items[i - 1] = x; } break;
    case 'down': if (i < d.items.length - 1) { const y = d.items[i]; d.items[i] = d.items[i + 1]; d.items[i + 1] = y; } break;
    case 'del': d.items.splice(i, 1); break;
    case 'add': {
      d.items.push({ kind: $('#addkind').value, time: '', text: '' }); render(true);
      const tas = app.querySelectorAll('textarea[data-f^="items."]');
      if (tas.length) { const last = tas[tas.length - 1]; last.focus(); last.scrollIntoView({ block: 'center' }); }
      return;
    }
    case 'tnew': d.tables.push({ title: '新表格', headers: ['項目', '內容'], rows: [['', '']] }); break;
    case 'tdel': if (confirm('確定刪除這個表格？')) d.tables.splice(t, 1); else return; break;
    case 'trow': d.tables[t].rows.push(d.tables[t].headers.map(() => '')); break;
    case 'trowdel': d.tables[t].rows.splice(r, 1); break;
    case 'tcol': d.tables[t].headers.push('新欄'); d.tables[t].rows.forEach(row => row.push('')); break;
    case 'tcoldel': if (d.tables[t].headers.length > 1) { d.tables[t].headers.pop(); d.tables[t].rows.forEach(row => row.pop()); } break;
    case 'dayadd': {
      let v = prompt('新增哪一天？請輸入日期，例如 2027-01-05');
      if (!v) return; v = v.trim().replace(/\//g, '-');
      const p = v.split('-'); if (p.length === 3) v = p[0] + '-' + pad(p[1]) + '-' + pad(p[2]);
      if (!validId(v) || isNaN(new Date(v + 'T00:00:00'))) return toast('日期格式不正確');
      if (data.days.some(x => x.date === v)) return toast('這天已經有行程了');
      data.days.push(normDay({ date: v, title: '新的一天' })); sortDays(data.days); location.hash = '#' + v; return;
    }
    case 'daydel':
      if (!confirm('確定刪除 ' + md(d.date) + ' 整天的行程？')) return;
      data.days.splice(data.days.indexOf(d), 1); location.hash = ''; return;
    case 'exportjson': download('itinerary-backup.json', JSON.stringify(data, null, 1), 'application/json'); return;
    case 'importjson': importJson(); return;
    default: return;
  }
  render(true);
});
document.addEventListener('keydown', e => {
  if (edit || !cur || state !== 'app') return;
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')) return;
  const idx = data.days.indexOf(curDay()); let n = null;
  if (e.key === 'ArrowLeft') n = data.days[idx - 1];
  if (e.key === 'ArrowRight') n = data.days[idx + 1];
  if (n) location.hash = '#' + n.date;
});
window.addEventListener('hashchange', route);
window.addEventListener('online', () => { if (state === 'app') render(true); });
window.addEventListener('offline', () => { if (state === 'app') render(true); });
window.addEventListener('beforeunload', e => {
  if (edit && snap !== null && JSON.stringify(data) !== snap) { e.preventDefault(); e.returnValue = ''; }
});

render(false);
</script>
</body>
</html>
